<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tetherbore</title>
<meta name="description" content="Cut the ground free and reel it in. A one-thumb mining game with pixel art made in Pixelbolt.">
<meta name="theme-color" content="#07060b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<!-- The modules js/main.js imports, and the atlas it loads first, are asked for at once, so they download together
     where the browser would find each only when the one before had come (main, then game, then world and audio, and
     the atlas last of all). The atlas is fetched by fetch(), so its preload must be crossorigin to be the same request,
     or it downloads twice. A module renamed or added is renamed or added here too; js/shot.js stays out, as it is
     fetched only for ?shot. -->
<link rel="modulepreload" href="js/game.js">
<link rel="modulepreload" href="js/world.js">
<link rel="modulepreload" href="js/audio.js">
<link rel="modulepreload" href="js/atlas.js">
<link rel="modulepreload" href="js/shop.js">
<link rel="modulepreload" href="js/drawing.js">
<link rel="preload" href="assets/atlas.json" as="fetch" crossorigin>
</head>
<body>
<canvas id="game" aria-label="Tetherbore"></canvas>
<canvas id="rope" aria-hidden="true"></canvas>
<noscript>Tetherbore needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
